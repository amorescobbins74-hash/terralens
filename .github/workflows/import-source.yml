name: Import TerraLens source
on:
  push:
    paths: ['.github/workflows/import-source.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand source
        run: |
          echo '740e1913a98d03234b734022085d51ca26db285606d397ddde972cbfb234a65f  terralens-source.zip' | sha256sum -c -
          unzip -o terralens-source.zip
          git rm -f terralens-source.zip .github/workflows/import-source.yml .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import complete TerraLens source, data, tests and documentation'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm test && npm run build:github
